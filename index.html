<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
    <title>Gorillas Burgers</title>
</head>
<body>
    <div class="cTitulo">
    <img src="img/gorilla.png" alt="gorilla" class="imgTitulo">
    <img src="img/hamburger.png" alt="hamburger" class="imgTitulo">
    <h1>Gorillas Burgers</h1>
    <p id="subtexto">Dark Kitchen POS</p>
    </div>

    <div class="cG">
        <div class="cM">    
        <h2>Menú</h2>
        <p class="clasicaBurger">Clásica - $120</p>
        <div class="menuImg">
        <img src="img/hamburger.png" alt="hamburger" class="imgProducto">
        <img src="img/hamburger.png" alt="hamburger" class="imgProducto" id="burgerImg">
        <p>Doble Carne - $150</p>
        </div>
        <div class="menuImg">
        <img src="img/gorilla.png" alt="gorilla" class="imgProducto">
        <img src="img/bacon.png" alt="bacon" class="imgProducto" id="tocinoImg">
        <p>Gorilla Especial - $180</p>
        </div>
        </div>
        <div class="cC">
        <h2>Captura</h2>
        <input type="text" id="nombreCliente" placeholder="Nombre del Cliente">
        <select id="BurgerSelect">
            <option value="" selected disabled>Selecciona una burger...</option>
            <option value="Clásica" data-precio="120">Clásica</option>
            <option value="Doble Carne" data-precio="150">Doble Carne</option>
            <option value="Gorilla Especial" data-precio="180">Gorilla Especial</option>
        </select>
        <select id="cantidad">
            <option value=""selected disabled>Cantidad</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
        <button id="btnAgregar">Agregar a la Cuenta</button>
        </div>
        <div id="contenedorTicket" class="cT">
        <h2>Ticket Actual</h2>
        <div id="productosAgregados"></div>
        <h4 id="totalFinal">Total: $0.00</h4>
        <button id="btnPedido">Lanzar Pedido A Cocina</button>
        </div>
        
    </div>

</body>
</html>
